services:
  - type: web
    name: dshs-share-app
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    disk:
      name: dshs-share-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        value: file:./storage/data/dshs-share.db
      - key: ALLOWED_EMAIL_DOMAINS
        value: dshs.kr
      - key: SIGNUP_BONUS_POINTS
        value: "300"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: TRUST_PROXY_HTTPS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
